[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "osint-tool"
version = "1.2.0"
description = "Modular OSINT toolkit for domain, email, social media, and IP intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["osint", "security", "reconnaissance", "intelligence", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "python-whois>=0.9.4",
    "dnspython>=2.6.1",
    "rich>=13.7.0",
    "click>=8.1.7",
    "aiohttp>=3.9.0",
    "phonenumbers>=8.13.0",
    "ipwhois>=1.2.0",
    "bs4>=0.0.2",
    "lxml>=5.1.0",
    "certifi>=2024.0.0",
    "Pillow>=10.0.0",
    "exifread>=3.0.0",
    "geopy>=2.4.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]
ai = [
    "anthropic>=0.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]
all = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "anthropic>=0.28.0",
    "instaloader>=4.13",
    "holehe>=1.20",
    "maigret>=0.4.4",
]

[project.scripts]
osint-tool = "osint:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["tests/", ".venv/", "venv/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W503", "F401"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]
